<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PulseForms</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f0;
      color: #1d2448;
    }
    .pf-shell { max-width: 920px; margin: 0 auto; padding: 28px; }
    .pf-panel {
      background: #fff;
      border: 1px solid #d7deec;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 14px 30px rgba(32, 42, 90, 0.06);
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; color: #202a5a; }
    p { margin: 0; color: #667085; line-height: 1.5; }
    .pf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .pf-card { border: 1px solid #d7deec; border-radius: 10px; padding: 14px; background: #fbfcff; }
    .pf-card strong { display: block; margin-bottom: 4px; color: #202a5a; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 720px) { .pf-grid { grid-template-columns: 1fr; } .pf-shell { padding: 18px; } }
  </style>
</head>
<body>
  <main class="pf-shell">
    <section class="pf-panel">
      <h1>PulseForms</h1>
      <p id="pfIntro">CRM query and submit widget. Admin configuration is available; runtime actions will be connected next.</p>
      <div class="pf-grid">
        <div class="pf-card"><strong>Campaign</strong><code id="pfCampaign">-</code></div>
        <div class="pf-card"><strong>Identifier</strong><code id="pfIdentifier">-</code></div>
        <div class="pf-card"><strong>Mode</strong><span>Query / submit CRM information</span></div>
        <div class="pf-card"><strong>Status</strong><span>Demo shell ready</span></div>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const demo = params.get("demo") === "1";
    document.getElementById("pfCampaign").textContent = demo ? "demo" : (params.get("campaign") || "-");
    document.getElementById("pfIdentifier").textContent = params.get("phone") || params.get("customer_id") || params.get("customerId") || (demo ? "+15551234567" : "-");
  </script>
</body>
</html>
