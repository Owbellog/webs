<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseForms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --pf-accent:      #4a6cf7;
        --pf-accent-soft: rgba(74,108,247,.08);
        --pf-green:       #18b26b;
        --pf-yellow:      #e8a020;
        --pf-red:         #e53935;
        --pf-bg:          #f2f4fb;
        --pf-panel:       #ffffff;
        --pf-border:      rgba(74,108,247,.12);
        --pf-radius:      12px;
        --pf-shadow:      0 2px 14px rgba(28,40,83,.07);
        --pf-header-h:    50px;
        --pf-font:        "Manrope", sans-serif;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        font-family: var(--pf-font);
        font-size: 13px;
        background: var(--pf-bg);
        color: #1c2040;
      }

      /* ── Header ─────────────────────────────────────────────────────────── */
      .pf-header {
        height: var(--pf-header-h);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        background: var(--pf-panel);
        border-bottom: 1px solid var(--pf-border);
        flex-shrink: 0;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .pf-header-icon {
        width: 30px; height: 30px;
        background: var(--pf-accent);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .pf-header-icon svg {
        width: 16px; height: 16px;
        fill: none; stroke: #fff;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      }

      .pf-header-title {
        font-size: .95rem; font-weight: 800;
        color: #1c2040; flex: 1;
        letter-spacing: -.01em;
      }

      .pf-header-badge {
        font-size: .75rem; font-weight: 700;
        color: var(--pf-accent);
        background: var(--pf-accent-soft);
        border: 1px solid rgba(74,108,247,.2);
        border-radius: 20px;
        padding: 3px 10px;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pf-sources-row {
        display: flex; align-items: center; gap: 4px;
      }
      .pf-src-dot {
        width: 7px; height: 7px;
        border-radius: 50%; cursor: default;
      }
      .pf-src-dot--ok    { background: var(--pf-green); }
      .pf-src-dot--error { background: var(--pf-red); }
      .pf-src-dot--idle  { background: #c8cdd8; }

      .pf-header-btn {
        background: none;
        border: 1px solid var(--pf-border);
        border-radius: 7px;
        padding: 4px 10px;
        font-size: .73rem; font-weight: 700;
        cursor: pointer; color: #666d7d;
        font-family: inherit;
        transition: background .15s;
        white-space: nowrap;
      }
      .pf-header-btn:hover { background: rgba(0,0,0,.04); }
      .pf-header-btn:disabled { opacity: .45; cursor: default; }

      /* ── Body ────────────────────────────────────────────────────────────── */
      .pf-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: calc(100vh - var(--pf-header-h));
      }

      /* ── Card ────────────────────────────────────────────────────────────── */
      .pf-card {
        background: var(--pf-panel);
        border-radius: var(--pf-radius);
        box-shadow: var(--pf-shadow);
        border: 1px solid var(--pf-border);
        overflow: hidden;
      }

      .pf-card-head {
        display: flex; align-items: center; gap: 7px;
        padding: 9px 13px 8px;
        border-bottom: 1px solid rgba(0,0,0,.04);
        background: rgba(74,108,247,.03);
      }
      .pf-card-head h3 {
        font-size: .78rem; font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--pf-accent);
      }
      .pf-card-body { padding: 12px 13px; }

      /* ── Form fields ─────────────────────────────────────────────────────── */
      .pf-form { display: flex; flex-direction: column; gap: 10px; }

      .pf-field { display: flex; flex-direction: column; gap: 4px; }

      .pf-label {
        font-size: .75rem; font-weight: 700;
        color: #555d72;
        display: flex; align-items: center; gap: 4px;
      }
      .pf-required { color: var(--pf-red); font-size: .7rem; }

      .pf-input,
      .pf-select,
      .pf-textarea {
        width: 100%;
        font-family: var(--pf-font);
        font-size: .82rem;
        font-weight: 500;
        color: #1c2040;
        background: #f8f9ff;
        border: 1px solid rgba(74,108,247,.18);
        border-radius: 8px;
        padding: 7px 10px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
      }
      .pf-input:focus,
      .pf-select:focus,
      .pf-textarea:focus {
        border-color: var(--pf-accent);
        box-shadow: 0 0 0 3px var(--pf-accent-soft);
        background: #fff;
      }
      .pf-textarea { resize: vertical; min-height: 64px; }

      .pf-checkbox-row {
        display: flex; align-items: center; gap: 8px;
        font-size: .82rem; font-weight: 500;
        cursor: pointer;
      }
      .pf-checkbox-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }

      /* pre-filled highlight */
      .pf-input.pf-prefilled,
      .pf-select.pf-prefilled,
      .pf-textarea.pf-prefilled {
        background: rgba(24,178,107,.06);
        border-color: rgba(24,178,107,.3);
      }

      /* ── Mode badge ──────────────────────────────────────────────────────── */
      .pf-mode-badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: .72rem; font-weight: 700;
        padding: 2px 8px; border-radius: 20px;
        border: 1px solid;
      }
      .pf-mode-badge--query  { color: var(--pf-accent); border-color: rgba(74,108,247,.25); background: var(--pf-accent-soft); }
      .pf-mode-badge--submit { color: var(--pf-green);  border-color: rgba(24,178,107,.25); background: rgba(24,178,107,.07); }
      .pf-mode-badge--both   { color: var(--pf-yellow); border-color: rgba(232,160,32,.25);  background: rgba(232,160,32,.07); }

      /* ── Submit button ───────────────────────────────────────────────────── */
      .pf-submit-btn {
        width: 100%;
        padding: 10px;
        font-family: var(--pf-font);
        font-size: .84rem; font-weight: 800;
        color: #fff;
        background: var(--pf-accent);
        border: none; border-radius: 9px;
        cursor: pointer;
        transition: opacity .15s, transform .1s;
        margin-top: 4px;
      }
      .pf-submit-btn:hover:not(:disabled) { opacity: .88; }
      .pf-submit-btn:active:not(:disabled) { transform: scale(.98); }
      .pf-submit-btn:disabled { opacity: .45; cursor: default; }

      /* ── Status banner ───────────────────────────────────────────────────── */
      .pf-banner {
        border-radius: var(--pf-radius);
        padding: 10px 13px;
        font-size: .8rem; line-height: 1.5;
        display: flex; align-items: flex-start; gap: 8px;
      }
      .pf-banner strong { display: block; font-size: .84rem; margin-bottom: 2px; }
      .pf-banner--ok {
        background: rgba(24,178,107,.08);
        border: 1px solid rgba(24,178,107,.25);
        color: #0d7a48;
      }
      .pf-banner--error {
        background: rgba(229,57,53,.06);
        border: 1px solid rgba(229,57,53,.22);
        color: var(--pf-red);
      }
      .pf-banner--info {
        background: var(--pf-accent-soft);
        border: 1px solid rgba(74,108,247,.2);
        color: var(--pf-accent);
      }

      /* ── Loading ─────────────────────────────────────────────────────────── */
      .pf-loading {
        flex: 1;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 12px; color: #888d9b;
        font-size: .82rem; padding: 28px;
      }
      .pf-spinner {
        width: 30px; height: 30px;
        border: 3px solid rgba(74,108,247,.15);
        border-top-color: var(--pf-accent);
        border-radius: 50%;
        animation: pf-spin .7s linear infinite;
      }
      @keyframes pf-spin { to { transform: rotate(360deg); } }

      /* ── Error full screen ───────────────────────────────────────────────── */
      .pf-error-full {
        background: rgba(229,57,53,.06);
        border: 1px solid rgba(229,57,53,.2);
        border-radius: var(--pf-radius);
        padding: 18px 20px;
        color: var(--pf-red);
        font-size: .84rem; line-height: 1.5;
      }
      .pf-error-full strong { display: block; margin-bottom: 4px; font-size: .9rem; }

      /* ── Timestamp ───────────────────────────────────────────────────────── */
      .pf-timestamp {
        font-size: .68rem; color: #aab0bf;
        text-align: right; padding: 2px 0;
      }

      /* ── Two-col grid for wider views ────────────────────────────────────── */
      @media (min-width: 520px) {
        .pf-form.pf-form--2col {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .pf-form.pf-form--2col .pf-field--full { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>

    <!-- HEADER -->
    <header class="pf-header" id="pfHeader">
      <div class="pf-header-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M7 8h10M7 12h6M7 16h4"/>
        </svg>
      </div>
      <span class="pf-header-title" id="pfTitle">PulseForms</span>
      <span class="pf-header-badge" id="pfBadge" hidden></span>
      <div class="pf-sources-row" id="pfSourcesRow"></div>
      <button type="button" class="pf-header-btn" id="pfRefreshBtn" hidden>↻ Refresh</button>
    </header>

    <!-- BODY -->
    <div class="pf-body" id="pfBody">
      <!-- filled by pulseforms.js -->
    </div>

    <script src="./i18n.js"></script>
    <script src="./pulseforms.js"></script>
  </body>
</html>
